<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>YOLO目标检测演示</title>
    <style>
        /* 下面这一块是样式，用来美化页面，不是功能，可以直接复制，不用改 */
        body {
            font-family: "Microsoft YaHei", Arial;
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
            background-color: #f4f5f7;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #00000018;
        }
        h2 {
            color: #222;
        }
        #fileInput {
            margin: 15px 0;
        }
        button {
            padding: 8px 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size:15px;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #result {
            margin-top:25px;
            padding:15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            min-height:40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>YOLO 图片检测 Web演示</h2>
        <p>选择一张图片，提交给后端YOLO模型识别</p>

        <!-- 文件选择框：用来在电脑选图片 -->
        <input type="file" id="fileInput" accept="image/*">
        <br>
        <!-- 按钮：点击之后，执行上传图片的函数 -->
        <button onclick="uploadImage()">提交检测</button>

        <!-- 这里用来展示返回结果 -->
        <div id="result">等待上传图片...</div>
    </div>

    <script>
        // 【上传图片的函数】
        async function uploadImage(){
            // 1.拿到文件选择框
            const fileInput = document.getElementById("fileInput");
            // 2.拿到用户选中的图片
            const selectedFile = fileInput.files[0];

            // 判断：如果没有选图片，弹窗提醒
            if (!selectedFile) {
                alert("请先选择一张图片！");
                return;
            }

            // FormData：专门用来上传文件，固定写法
            const formData = new FormData();
            formData.append("file", selectedFile);

            // 修改提示文字
            document.getElementById("result").innerText = "正在上传，模型识别中，请稍等...";

            try {
                // 向后端 /detect 接口发送图片
                const response = await fetch("/detect", {
                    method: "POST",
                    body: formData
                });
                // 拿到后端返回的json
                const data = await response.json();
                // 把识别结果写在页面上
                document.getElementById("result").innerText
                    = "✅ 识别到物体：" + data.found_objects.join("、");
            }
            catch(error) {
                // 如果出错，在这里显示
                document.getElementById("result").innerText = "❌ 请求失败！请确认后端 main.py 已经启动！";
                console.log(error);
            }
        }
    </script>
</body>
</html>
